name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  firmware:
    name: ESP-IDF 5.5.3 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP32-C6 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c6
          path: .

  host-tests:
    name: Native host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and run host tests
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c6
          path: .
          command: >-
            bash -lc 'cmake -S test -B build-host-tests -G Ninja
            -DIDF_PATH="$IDF_PATH" &&
            cmake --build build-host-tests &&
            ctest --test-dir build-host-tests --output-on-failure'

  runner-tests:
    name: Python partial-runner tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run station-runner unit tests
        run: python -m unittest tools.test_s5otbrft_runner -v
